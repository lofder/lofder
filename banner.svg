<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fd1c5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#63b3ed;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1a1d23" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="1280" y2="40"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- node network - left cluster -->
  <g opacity="0.4">
    <circle cx="120" cy="100" r="3" fill="#4fd1c5"/>
    <circle cx="200" cy="60" r="2.5" fill="#4fd1c5"/>
    <circle cx="260" cy="130" r="3.5" fill="#4fd1c5"/>
    <circle cx="180" cy="180" r="2" fill="#4fd1c5"/>
    <circle cx="310" cy="80" r="2" fill="#63b3ed"/>
    <circle cx="80" cy="200" r="2.5" fill="#63b3ed"/>
    <line x1="120" y1="100" x2="200" y2="60" stroke="#4fd1c5" stroke-width="0.8" opacity="0.5"/>
    <line x1="200" y1="60" x2="260" y2="130" stroke="#4fd1c5" stroke-width="0.8" opacity="0.4"/>
    <line x1="120" y1="100" x2="260" y2="130" stroke="#4fd1c5" stroke-width="0.8" opacity="0.3"/>
    <line x1="120" y1="100" x2="180" y2="180" stroke="#4fd1c5" stroke-width="0.8" opacity="0.3"/>
    <line x1="200" y1="60" x2="310" y2="80" stroke="#63b3ed" stroke-width="0.6" opacity="0.3"/>
    <line x1="180" y1="180" x2="80" y2="200" stroke="#63b3ed" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- node network - right cluster -->
  <g opacity="0.3">
    <circle cx="950" cy="180" r="3" fill="#4fd1c5"/>
    <circle cx="1040" cy="140" r="2.5" fill="#4fd1c5"/>
    <circle cx="1100" cy="220" r="3" fill="#63b3ed"/>
    <circle cx="1180" cy="160" r="2" fill="#63b3ed"/>
    <circle cx="1020" cy="250" r="2.5" fill="#4fd1c5"/>
    <circle cx="1200" cy="100" r="2" fill="#4fd1c5"/>
    <line x1="950" y1="180" x2="1040" y2="140" stroke="#4fd1c5" stroke-width="0.8" opacity="0.4"/>
    <line x1="1040" y1="140" x2="1100" y2="220" stroke="#4fd1c5" stroke-width="0.8" opacity="0.3"/>
    <line x1="1100" y1="220" x2="1180" y2="160" stroke="#63b3ed" stroke-width="0.6" opacity="0.3"/>
    <line x1="950" y1="180" x2="1020" y2="250" stroke="#4fd1c5" stroke-width="0.6" opacity="0.3"/>
    <line x1="1180" y1="160" x2="1200" y2="100" stroke="#63b3ed" stroke-width="0.6" opacity="0.25"/>
    <line x1="1040" y1="140" x2="1180" y2="160" stroke="#4fd1c5" stroke-width="0.6" opacity="0.2"/>
  </g>

  <!-- center connection traces -->
  <g opacity="0.15">
    <path d="M310 80 Q 500 120 640 160 Q 780 200 950 180" stroke="url(#accent)" stroke-width="1.2" fill="none"/>
    <path d="M260 130 Q 450 190 640 170 Q 830 150 1040 140" stroke="url(#accent)" stroke-width="0.8" fill="none"/>
  </g>

  <!-- scattered dots -->
  <g opacity="0.15">
    <circle cx="420" cy="90" r="1.5" fill="#4fd1c5"/>
    <circle cx="520" cy="230" r="1" fill="#63b3ed"/>
    <circle cx="580" cy="110" r="1.5" fill="#4fd1c5"/>
    <circle cx="700" cy="250" r="1" fill="#63b3ed"/>
    <circle cx="760" cy="70" r="1.5" fill="#4fd1c5"/>
    <circle cx="850" cy="270" r="1" fill="#4fd1c5"/>
    <circle cx="440" cy="260" r="1" fill="#63b3ed"/>
    <circle cx="680" cy="50" r="1" fill="#4fd1c5"/>
  </g>

  <!-- text -->
  <text x="640" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="300" fill="#e2e8f0" letter-spacing="8">lofder</text>
  <text x="640" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#718096" letter-spacing="4">AI AGENT INFRA &amp; E-COMMERCE AUTOMATION</text>
</svg>
